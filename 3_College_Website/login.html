<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="Login">
        <div>
            <h1 id="header">Government College Of Engineering And Technology Jammu</h1>
            <img id="logo" src="gallery/gcet_logo_transparent.png" alt="College Logo" class="logo">
        </div>
    </header>
    <nav>
    <a href="home.html">Home</a>
    <a href="faculty.html">Faculty</a>
    <a href="gallery.html">Photo Gallery</a>
    <a href="Form.html">Student Admission</a>
    </nav>
    <main>
        <section class="Login_form">
            <h1 align="center">Student Login</h1>
            <form action="dashboard.html" method="get">
                <div class="login-row">
                    Email:
                    <input type="email" name="email" placeholder="Enter Your email" required>
                </div>
                <div class="login-row">
                    password:
                    <input type="password" name="password" placeholder="Enter password">
                </div>
                <div class="login-row">
                    Remember Me
                    <input type="checkbox" name="Remember Me" id="Remember_me">
                </div>
                <div class="button">
                    <input type="submit" value="Login">
                </div>
            </form>
        </section>
    </main>
    <footer>
            <p>2026 GCET Jammu. All Rights Reserved.</p>
    </footer>

</body>

</html>
